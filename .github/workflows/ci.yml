name: Test Tickover

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python syntax
        run: python -m py_compile app.py launcher.py backup.py tools/generate_sounds.py
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>') + len('<script>')
          end = html.find('</script>', start)
          Path('/tmp/tickover.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/tickover.js
      - name: Tests
        run: pytest -q
